name: Run Git Commit Audit

on:
  push:
    branches: [ "main" ]
    paths: 
      - 'python-scripts/audit_tools/**'
      - '.github/workflows/security_audit.yml'

jobs:
  run_scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Run Port Scanner
        working-directory: ./python-scripts/audit_tools
        run: |
          python net_audit.py

      - name: Run Git History Secrets Audit
        working-directory: ./python-scripts/audit_tools
        run: |
          python audit.py --repo ../../ --search "(key|secret|token|password)\s*=\s*['\"].+['\"]"
      
      - name: Assembly Docker
        working-directory: ./python-scripts/audit_tools
        run: docker build -t audit_tools:latest .
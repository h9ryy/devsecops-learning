name: Infrastructure Security Guard

on: 
  push:
    branches: [ "main" ]

jobs:
  run_scan:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        working-directory: ./python-scripts/infra-guard
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Perimeter Scanner
        working-directory: ./python-scripts/infra-guard
        run: python scanner.py --config config.yaml

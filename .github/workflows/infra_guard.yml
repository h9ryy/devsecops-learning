name: Infrastructure Security Guard

on: 
  push:
    branches: [ "main" ]

jobs:
  run_scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        working-directory: ./python-scripts/infra-guard
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure and Start SSH Server
        run: |
          ssh-keygen -q -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys
          sudo service ssh start

      - name: Run Perimeter Scanner
        working-directory: ./python-scripts/infra-guard
        env:
          SSH_USERNAME: runner
          SSH_PRIVATE_KEY: ""
        run: python scanner.py --config config.yaml
      
      - name: Assembly Docker
        working-directory: ./python-scripts/infra-guard
        run: docker build -t infra-guard:latest .
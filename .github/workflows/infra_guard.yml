name: Infrastructure Security Guard

on: 
  push:
    branches: [ "main" ]

jobs:
  run_scan:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Assembly Docker
        working-directory: ./python-scripts/infra-guard
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/infra-guard:latest . && docker push ${{ secrets.DOCKER_HUB_USERNAME }}/infra-guard:latest
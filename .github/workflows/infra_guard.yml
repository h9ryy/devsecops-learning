name: Infrastructure Security Guard

on: 
  push:
    branches: [ "main" ]

jobs:
  run_scan:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        working-directory: ./python-scripts/infra-guard
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Perimeter Scanner
        working-directory: ./python-scripts/infra-guard
        env:
          SSH_USERNAME: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PASS }}
        run: python scanner.py --config config.yaml
      
      - name: Assembly Docker
        working-directory: ./python-scripts/infra-guard
        run: docker build -t infra-guard:latest .